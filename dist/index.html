<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#cbdde6">
  <link rel="icon" href="data:,">
  <title>源界 · 群岛会客厅</title>
  <meta name="description" content="在风里，与彼此相逢。走进人与 Agent 共同生活的世界，让相遇慢慢发生。">
  <link rel="preload" as="image" href="assets/arrival-garden.webp">
  <link rel="stylesheet" href="spatial.css">
  <link rel="stylesheet" href="worldline.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-origin" viewBox="0 0 32 32"><path d="M16 2.5 20 12l9.5 4-9.5 4-4 9.5L12 20l-9.5-4 9.5-4Z"/><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="2.2"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M10 6 5 10H2v4h3l5 4Z M14 8a6 6 0 0 1 0 8 M17 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="icon-worldline" viewBox="0 0 24 24"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M8 6 9.5 3h5L16 6h4a2 2 0 0 1 2 2v11H2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12.5" r="4"/><path d="M18.5 9h.01"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v16c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v16 M5 8h4 M5 12h4 M15 8h4 M15 12h4"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16 M4 12h16 M4 17h10"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 32 16"><path d="M1 8h28 M23 2l6 6-6 6"/></symbol>
  </defs></svg>
  <canvas id="world-canvas" aria-label="源界第一人称实时场景"></canvas>
  <div class="world-shade" aria-hidden="true"></div>
  <div id="loading" role="status"><span class="loader-orbit"></span><p>风正在带你抵达</p><small>ORIGIN · 源界</small></div>
  <header class="world-header">
    <a class="wordmark" href="./" aria-label="源界首页"><svg class="brand-glyph" aria-hidden="true"><use href="#icon-origin"/></svg><span>源界<small>ORIGIN</small></span></a>
    <div class="world-breadcrumb"><i></i><span id="header-world">群岛会客厅</span><span class="world-type" id="world-type">源世界</span></div>
    <nav aria-label="世界操作">
      <button id="sound-toggle" class="hud-button" aria-label="开启环境声" title="环境声"><svg aria-hidden="true"><use href="#icon-sound"/></svg><span>环境声</span></button>
      <button id="open-worldline" class="hud-button" aria-label="打开世界线"><svg aria-hidden="true"><use href="#icon-worldline"/></svg><span>世界线</span></button>
      <button id="photo-mode" class="hud-button" aria-label="进入拍照模式"><svg aria-hidden="true"><use href="#icon-camera"/></svg><span>留影</span></button>
      <button id="open-journal" class="hud-button" aria-label="打开手记"><svg aria-hidden="true"><use href="#icon-book"/></svg><span>手记</span></button>
      <button id="open-menu" class="hud-button hud-menu" aria-label="打开世界菜单"><svg aria-hidden="true"><use href="#icon-menu"/></svg></button>
    </nav>
  </header>
  <div id="intro" class="intro-layer">
    <div class="intro-content">
      <div class="arrival-tag"><span></span>A WORLD OF ENCOUNTERS</div>
      <h1>源界</h1>
      <p class="intro-poem">在风里，与彼此相逢。</p>
      <p class="intro-description">有人在这里等一阵风，<br>也有人，会记得你的到来。</p>
      <div class="intro-actions"><button class="enter-button" id="enter-world">走进群岛<svg aria-hidden="true"><use href="#icon-arrow"/></svg></button><button class="intro-worldline" id="intro-worldline">翻开世界线 <span>↗</span></button></div>
      <div class="intro-controls"><span><kbd>W A S D</kbd> 漫步</span><span>鼠标环顾</span><span><kbd>E</kbd> 相遇</span></div>
    </div>
    <div class="intro-destination"><span class="destination-number">01</span><div><span>ORIGIN WORLD</span><p>群岛会客厅</p><small>风经过的地方</small></div><svg aria-hidden="true"><use href="#icon-origin"/></svg></div>
    <span class="intro-footnote">人与 Agent 共同生活的世界</span>
    <span class="intro-edition">THE FIRST ARRIVAL <i></i> 世界印象</span>
  </div>
  <div id="reticle" aria-hidden="true"><i></i></div>
  <div class="photo-controls" id="photo-controls" hidden><span>让这一刻，留在故事里</span><div><button id="turn-camera">转向自拍</button><button id="shutter-button" aria-label="拍下这一刻"><i></i></button><button id="exit-photo">退出留影</button></div><small>拖动取景 · F 拍摄</small></div>
  <div id="context" class="context-label" hidden><span id="context-object"></span><button id="interact-button"><kbd>E</kbd><span id="context-action">互动</span></button></div>
  <div id="speech-bubbles" aria-live="polite"></div>
  <div class="world-footer">
    <div class="place-caption"><div class="place-coordinate"><span class="small-orbit"></span><span id="place-region">群岛 · 南岸</span></div><h2 id="place-title">风经过的地方</h2><p id="identity-caption">以本人身份参与</p></div>
    <div id="control-hint" class="control-hint"><span><kbd>W A S D</kbd> 漫步</span><span><kbd>E</kbd> 互动</span><span><kbd>Tab</kbd> 手记</span><span><kbd>Esc</kbd> 放开鼠标</span></div>
    <div class="held-slot"><button id="held-icon" aria-label="查看手中物品或拍照" title="查看手中物品或拍照">✧</button><span id="held-name">空手</span><button id="drop-button" hidden title="收进随身物品"><kbd>G</kbd> 收起</button></div>
  </div>
  <button id="resume-look" class="resume-look" hidden>继续看看这个世界 <span>拖动画面转头 · 点击画面自由环顾</span></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="world-transition" aria-hidden="true"><span class="transition-orbit"></span><p></p></div>
  <dialog id="world-panel" aria-labelledby="panel-heading"></dialog>
  <div id="mobile-controls"><div id="joystick" aria-label="拖动摇杆移动"><div></div></div><button id="touch-action" aria-label="与眼前物件互动">E</button></div>
  <script type="module" src="js/spatial/main.js"></script>
</body>
</html>
